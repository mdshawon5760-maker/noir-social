<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090d">
<title>NOIR — Social</title>
<meta name="description" content="NOIR Social — share photos, videos, and moments with your community.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://noir-social.netlify.app/">
<meta property="og:type" content="website">
<meta property="og:title" content="NOIR — Social">
<meta property="og:description" content="Share photos, videos, and moments with your community on NOIR Social.">
<meta property="og:url" content="https://noir-social.netlify.app/">

<style>
:root{--bg:#09090d;--panel:#121219;--panel2:#1a1a24;--line:#2b2b38;--text:#f4f3fb;--muted:#9a99ac;--pink:#ff4d9d;--purple:#8d6bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:1120px;margin:auto;display:grid;grid-template-columns:210px minmax(0,680px);gap:28px;padding:0 22px}.side{height:100vh;position:sticky;top:0;border-right:1px solid #20202a;padding:25px 18px 25px 0;display:flex;flex-direction:column}.brand{font-size:29px;font-weight:950;letter-spacing:-1.5px;margin:0 0 34px;background:linear-gradient(90deg,#fff,#b7a5ff,#ff6ab2);background-clip:text;color:transparent}.nav{display:grid;gap:7px}.nav button{border:0;background:none;text-align:left;padding:13px;border-radius:13px;font-weight:650}.nav button:hover{background:#1c1b27}.me{margin-top:auto;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.main{padding:24px 0 90px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:10px 13px}.primary{border:0;background:linear-gradient(100deg,var(--purple),var(--pink));border-radius:11px;padding:11px 15px;font-weight:800;color:white}.field{width:100%;background:#0d0d13;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;margin:6px 0 13px;outline:none}.field:focus{border-color:var(--purple)}.auth{max-width:420px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);padding:25px;border-radius:20px}.auth h1{margin:0 0 8px}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{flex:1}.stories{display:flex;gap:13px;overflow:auto;padding:4px 0 20px}.story{min-width:64px;text-align:center}.ring{width:58px;height:58px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--pink),#ffb84d,var(--purple));margin:auto auto 5px}.ring div{height:100%;border:3px solid var(--bg);border-radius:50%;background:#27243b;display:grid;place-items:center;font-weight:800}.post{background:#101016;border:1px solid #252530;border-radius:17px;overflow:hidden;margin-bottom:20px}.posthead{display:flex;align-items:center;gap:10px;padding:13px}.avatar{width:39px;height:39px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--purple));display:grid;place-items:center;font-weight:850;flex-shrink:0}.posthead b{font-size:13px}.posthead .muted{margin-top:2px}.media{width:100%;display:block;max-height:650px;object-fit:contain;background:#050508}.actions{display:flex;gap:15px;padding:12px 14px}.actions button{border:0;background:none;font-size:22px;padding:0}.liked{color:#ff507b!important}.postbody{padding:0 14px 15px;font-size:13px}.caption{margin:6px 0}.comments{border-top:1px solid var(--line);padding:12px 14px}.commentline{font-size:13px;margin:7px 0;overflow-wrap:anywhere}.commentform{display:flex;gap:7px;margin-top:10px}.commentform input{margin:0;min-width:0}.commentform button{flex-shrink:0}.empty{padding:32px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:16px}.hidden{display:none!important}.status{font-size:13px;color:#d2c7ff;margin:10px 0;overflow-wrap:anywhere}.upload-preview{max-width:100%;max-height:250px;display:block;margin:8px 0;border-radius:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.profilehead{display:flex;align-items:center;gap:16px;padding:18px 0}.profilehead .avatar{width:72px;height:72px;font-size:24px}.divider{border:0;border-top:1px solid var(--line);margin:18px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#282837;border:1px solid #444458;padding:10px 15px;border-radius:12px;display:none;z-index:10}.toast.show{display:block}
@media(max-width:700px){.app{display:block;padding:0 12px}.side{display:none}.main{padding:14px 0 80px}.brand{font-size:25px}.mobilebrand{display:block}.post{border-radius:14px}.media{max-height:70vh}.bottom{display:flex!important;position:fixed;bottom:0;left:0;right:0;background:#0c0c12f5;backdrop-filter:blur(16px);border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:4}.bottom button{background:none;border:0;font-size:21px;padding:7px}.auth{margin:5vh auto;padding:20px}}
.bottom{display:none}
</style>
</head>
<body>
<div id="root"></div>
<nav class="bottom hidden" id="bottom"><button data-page="feed">⌂</button><button data-page="explore">⌕</button><button data-page="create">＋</button><button data-page="profile">◉</button><button data-page="logout">↪</button></nav>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Paste your Supabase Project URL and publishable key below.
   Never put a service_role/secret key in browser code. */
const SUPABASE_URL = "https://awpjnjpwlplfnpjzglja.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fjBmbpOMeaKL2bmlxh3nVA_pBgwSc2V";
const configured = !SUPABASE_URL.includes("YOUR_") && !SUPABASE_PUBLISHABLE_KEY.includes("YOUR_");
const client = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;
const root = document.querySelector("#root");
let session=null, page="feed", cachedPosts=[], followingIds=new Set();
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const note = s => {const t=document.querySelector("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)};
const userId=()=>session?.user?.id;
const username=()=>session?.user?.user_metadata?.username || session?.user?.email?.split("@")[0] || "you";
function setupError(){root.innerHTML=`<section class="auth"><div class="brand">NOIR.</div><h1>Connect your backend</h1><p class="muted">This starter needs a Supabase project before sign-up, uploads, likes and comments can work online.</p><p>1. Follow <b>README.md</b> in the downloaded project.<br>2. Run <b>supabase-schema.sql</b> in Supabase SQL Editor.<br>3. Create a public Storage bucket named <b>post-media</b> (the SQL creates it).<br>4. Paste your project URL and publishable key into <b>index.html</b>.</p><p class="muted">Use only the browser-safe publishable key here. Never expose a secret/service_role key.</p></section>`}
function authUI(mode="login"){root.innerHTML=`<section class="auth"><div class="brand">NOIR.</div><h1>${mode==="signup"?"Create your account":"Welcome back"}</h1><p class="muted">Your corner of the internet. Keep it kind. 🖤</p><div class="tabs"><button class="btn" id="loginTab">Log in</button><button class="btn" id="signupTab">Sign up</button></div><form id="authForm">${mode==="signup"?'<label class="muted">Username</label><input class="field" name="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_.]+" placeholder="your_username" required>':''}<label class="muted">Email</label><input class="field" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><label class="muted">Password</label><input class="field" name="password" type="password" minlength="8" autocomplete="${mode==="signup"?"new-password":"current-password"}" required placeholder="At least 8 characters"><button class="primary" style="width:100%" type="submit">${mode==="signup"?"Create account":"Log in"}</button><div class="status" id="authStatus"></div></form><p class="muted">Use a unique password. Be thoughtful about what you post publicly.</p></section>`;
document.querySelector("#loginTab").onclick=()=>authUI("login");document.querySelector("#signupTab").onclick=()=>authUI("signup");
document.querySelector("#authForm").onsubmit=async e=>{e.preventDefault();const form=new FormData(e.target),email=String(form.get("email")||"").trim(),password=String(form.get("password")||""),status=document.querySelector("#authStatus"),submit=e.target.querySelector('button[type="submit"]');status.textContent="Please wait…";submit.disabled=true;
try{let result;if(mode==="signup"){const handle=String(form.get("username")||"").trim().toLowerCase();result=await client.auth.signUp({email,password,options:{data:{username:handle}}})}else{result=await client.auth.signInWithPassword({email,password})}
if(result.error)throw result.error;
if(mode==="signup"&&!result.data.session){status.textContent="Account created. Check your email to confirm, then log in.";return}
session=result.data.session;await showApp();
}catch(error){status.textContent=error?.message||"Something went wrong. Please try again."}finally{submit.disabled=false}
}}
function shell(){document.querySelector("#bottom").classList.remove("hidden");root.innerHTML=`<div class="app"><aside class="side"><div class="brand">NOIR.</div><nav class="nav"><button data-page="feed">⌂ &nbsp; Home</button><button data-page="explore">⌕ &nbsp; Explore</button><button data-page="create">＋ &nbsp; Create post</button><button data-page="profile">◉ &nbsp; Profile</button><button data-page="logout">↪ &nbsp; Log out</button></nav><div class="me" id="me"></div></aside><main class="main"><header class="top"><div class="brand mobilebrand">NOIR.</div><div><button class="btn" data-page="create">＋ Create</button> <button class="btn" data-page="logout">Log out</button></div></header><div id="view"></div></main></div>`;document.querySelector("#me").textContent="@"+username();root.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>navigate(b.dataset.page));document.querySelectorAll("#bottom [data-page]").forEach(b=>b.onclick=()=>navigate(b.dataset.page))}
async function showApp(){shell();await navigate("feed")}
async function navigate(p){page=p;if(p==="logout"){await client.auth.signOut();session=null;document.querySelector("#bottom").classList.add("hidden");authUI();return}if(p==="create"){renderCreate();return}if(p==="profile"){await renderProfile();return}if(p==="explore"){await renderExplore();return}await renderFeed()}
function mediaUrl(path){return client.storage.from("post-media").getPublicUrl(path).data.publicUrl}
async function renderFeed(){
  const v=document.querySelector('#view');
  v.innerHTML='<div class="empty">Loading your feed…</div>';
  try {
    const {data:posts,error}=await client.from('posts').select('id,user_id,caption,media_path,media_type,created_at').order('created_at',{ascending:false}).limit(50);
    if(error) throw error;
    const rows=posts||[], ids=[...new Set(rows.map(p=>p.user_id).filter(Boolean))], postIds=rows.map(p=>p.id);
    let profiles=[],likes=[],comments=[],follows=[];
    // Posts are the essential feed data. Optional profile/activity queries must not hide posts.
    if(ids.length){
      const r=await client.from('profiles').select('id,username,display_name,avatar_url').in('id',ids);
      if(!r.error) profiles=r.data||[];
    }
    if(postIds.length){
      const [lr,cr]=await Promise.all([
        client.from('likes').select('post_id,user_id').in('post_id',postIds),
        client.from('comments').select('id,post_id,user_id,body,created_at').in('post_id',postIds).order('created_at',{ascending:true})
      ]);
      if(!lr.error) likes=lr.data||[];
      if(!cr.error) comments=cr.data||[];
    }
    const commenterIds=[...new Set(comments.map(x=>x.user_id).filter(Boolean))];
    let commenterProfiles=[];
    if(commenterIds.length){
      const r=await client.from('profiles').select('id,username').in('id',commenterIds);
      if(!r.error) commenterProfiles=r.data||[];
    }
    const profileMap=new Map(profiles.map(x=>[x.id,x]));
    const commenterMap=new Map(commenterProfiles.map(x=>[x.id,x]));
    cachedPosts=rows.map(p=>({...p,profiles:profileMap.get(p.user_id)||null,likes:likes.filter(x=>x.post_id===p.id),comments:comments.filter(x=>x.post_id===p.id).map(x=>({...x,profiles:commenterMap.get(x.user_id)||null}))}));
    const fr=await client.from('follows').select('following_id').eq('follower_id',userId());
    if(!fr.error) follows=fr.data||[];
    followingIds=new Set(follows.map(x=>x.following_id));
    v.innerHTML='<div class="stories"><div class="story"><div class="ring"><div>＋</div></div><span class="muted">Your moment</span></div><div class="story"><div class="ring"><div>✦</div></div><span class="muted">NOIR vibes</span></div></div><h3>For you <span class="muted">· Latest posts</span></h3>'+(cachedPosts.length?cachedPosts.map(postCard).join(""):'<div class="empty">No posts yet. Be the first to share something.</div>');
    wirePostActions();
  } catch(error) {
    v.innerHTML='<div class="empty">Could not load posts: '+esc(error?.message||'Unknown error')+'</div>';
  }
}
function postCard(p){const prof=p.profiles||{},name=prof.username||"member",liked=(p.likes||[]).some(x=>x.user_id===userId()),likes=(p.likes||[]).length,comments=p.comments||[];let media=p.media_path?`<${p.media_type==="video"?"video controls playsinline":"img"} class="media" src="${esc(mediaUrl(p.media_path))}" ${p.media_type==="video"?'':'alt="Post media" loading="lazy"'}></${p.media_type==="video"?"video":"img"}>`:`<div class="empty">Media unavailable</div>`;
return `<article class="post" id="post-${p.id}"><div class="posthead"><div class="avatar">${esc(name[0]?.toUpperCase()||"N")}</div><div><b>@${esc(name)}</b><div class="muted">${new Date(p.created_at).toLocaleString()}</div></div>${p.user_id!==userId()?`<button class="btn" data-follow="${p.user_id}">${followingIds.has(p.user_id)?"Following":"Follow"}</button>`:""}</div>${media}<div class="actions"><button class="${liked?"liked":""}" data-like="${p.id}">${liked?"♥":"♡"}</button><button data-focus-comment="${p.id}">▢</button><button data-share="${p.id}">➤</button></div><div class="postbody"><b>${likes} likes</b><p class="caption"><b>@${esc(name)}</b> ${esc(p.caption||"")}</p></div><div class="comments">${comments.slice(-3).map(c=>`<div class="commentline"><b>@${esc(c.profiles?.username||"member")}</b> ${esc(c.body)}</div>`).join("")}<form class="commentform" data-comment-form="${p.id}"><input class="field" name="body" maxlength="500" placeholder="Add a comment…" required><button class="primary">Post</button></form></div></article>`}
function wirePostActions(){document.querySelectorAll("[data-like]").forEach(b=>b.onclick=async()=>{const postId=b.dataset.like;const existing=await client.from("likes").select("post_id").eq("post_id",postId).eq("user_id",userId()).maybeSingle();let r;if(existing.data)r=await client.from("likes").delete().eq("post_id",postId).eq("user_id",userId());else r=await client.from("likes").insert({post_id:postId,user_id:userId()});if(r.error)note(r.error.message);else await renderFeed()});
document.querySelectorAll("[data-comment-form]").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const body=new FormData(f).get("body").trim();if(!body)return;const r=await client.from("comments").insert({post_id:f.dataset.commentForm,user_id:userId(),body});if(r.error)note(r.error.message);else await renderFeed()});
document.querySelectorAll("[data-follow]").forEach(b=>b.onclick=async()=>{const id=b.dataset.follow;let r;if(followingIds.has(id))r=await client.from("follows").delete().eq("follower_id",userId()).eq("following_id",id);else r=await client.from("follows").insert({follower_id:userId(),following_id:id});if(r.error)note(r.error.message);else await renderFeed()});
document.querySelectorAll("[data-focus-comment]").forEach(b=>b.onclick=()=>document.querySelector(`[data-comment-form="${b.dataset.focusComment}"] input`)?.focus());
document.querySelectorAll("[data-share]").forEach(b=>b.onclick=async()=>{const p=cachedPosts.find(x=>x.id===b.dataset.share);const url=location.href.split("#")[0]+"#post-"+b.dataset.share;try{if(navigator.share)await navigator.share({title:"NOIR post",text:p?.caption||"Check out this post",url});else{await navigator.clipboard.writeText(url);note("Post link copied")}}catch{}});
}
function renderCreate(){document.querySelector("#view").innerHTML=`<h2>Create a post</h2><form id="postForm"><label class="muted">Photo or video (max 50 MB in this starter)</label><input class="field" type="file" id="media" accept="image/*,video/mp4,video/webm,video/quicktime" required><div id="preview"></div><label class="muted">Caption</label><textarea class="field" name="caption" maxlength="2200" rows="4" placeholder="Write a caption…"></textarea><button class="primary" type="submit">Share post</button><div class="status" id="uploadStatus"></div></form>`;
const input=document.querySelector("#media");input.onchange=()=>{const f=input.files[0];if(!f)return;const u=URL.createObjectURL(f);document.querySelector("#preview").innerHTML=f.type.startsWith("video/")?`<video class="upload-preview" controls src="${u}"></video>`:`<img class="upload-preview" src="${u}" alt="Preview">`};
document.querySelector("#postForm").onsubmit=async e=>{e.preventDefault();const f=input.files[0],status=document.querySelector("#uploadStatus");if(!f)return;if(f.size>50*1024*1024){status.textContent="File is over 50 MB. Choose a smaller file.";return}if(!(f.type.startsWith("image/")||["video/mp4","video/webm","video/quicktime"].includes(f.type))){status.textContent="That file type is not supported.";return}const ext=(f.name.split(".").pop()||"bin").replace(/[^a-zA-Z0-9]/g,"").toLowerCase();const path=`${userId()}/${crypto.randomUUID()}.${ext}`;status.textContent="Uploading media…";const up=await client.storage.from("post-media").upload(path,f,{contentType:f.type,upsert:false});if(up.error){status.textContent=up.error.message;return}status.textContent="Saving post…";const ins=await client.from("posts").insert({user_id:userId(),caption:new FormData(e.target).get("caption").trim(),media_path:path,media_type:f.type.startsWith("video/")?"video":"image"});if(ins.error){await client.storage.from("post-media").remove([path]);status.textContent=ins.error.message;return}note("Post shared!");await navigate("feed")}}
async function renderProfile(){const v=document.querySelector("#view");const {data:profile}=await client.from("profiles").select("*").eq("id",userId()).maybeSingle();const {count:postsCount}=await client.from("posts").select("*",{count:"exact",head:true}).eq("user_id",userId());const {count:followerCount}=await client.from("follows").select("*",{count:"exact",head:true}).eq("following_id",userId());const {count:followingCount}=await client.from("follows").select("*",{count:"exact",head:true}).eq("follower_id",userId());v.innerHTML=`<div class="profilehead"><div class="avatar">${esc(username()[0]?.toUpperCase()||"Y")}</div><div><h2 style="margin:0">@${esc(profile?.username||username())}</h2><div class="muted">${esc(profile?.display_name||"NOIR member")}</div></div></div><div class="grid2"><div class="empty"><b>${postsCount||0}</b><br><span class="muted">Posts</span></div><div class="empty"><b>${followerCount||0}</b><br><span class="muted">Followers · Following ${followingCount||0}</span></div></div><hr class="divider"><h3>Your posts</h3>`;const {data:posts,error}=await client.from("posts").select("id,user_id,caption,media_path,media_type,created_at,profiles(username),likes(user_id),comments(id,body,created_at,profiles(username))").eq("user_id",userId()).order("created_at",{ascending:false});if(error){v.innerHTML+=`<p class="status">${esc(error.message)}</p>`;return}v.innerHTML+=(posts||[]).map(postCard).join("")||'<div class="empty">You have not posted yet.</div>';cachedPosts=posts||[];wirePostActions()}
async function renderExplore(){const v=document.querySelector("#view");v.innerHTML=`<h2>Explore</h2><input class="field" id="search" placeholder="Search usernames or captions…"><div id="results" class="empty">Loading posts…</div>`;const {data,error}=await client.from("posts").select("id,user_id,caption,media_path,media_type,created_at,profiles(username),likes(user_id),comments(id,body,created_at,profiles(username))").order("created_at",{ascending:false}).limit(100);if(error){document.querySelector("#results").textContent=error.message;return}cachedPosts=data||[];const draw=q=>{const items=cachedPosts.filter(p=>(p.caption+" "+(p.profiles?.username||"")).toLowerCase().includes(q.toLowerCase()));document.querySelector("#results").className="";document.querySelector("#results").innerHTML=items.map(postCard).join("")||'<div class="empty">No matching posts.</div>';wirePostActions()};draw("");document.querySelector("#search").oninput=e=>draw(e.target.value)}
async function boot(){if(!configured){setupError();return}const {data}=await client.auth.getSession();session=data.session;if(session)await showApp();else authUI();client.auth.onAuthStateChange(async(_event,s)=>{session=s;if(s&&page!=="feed")await showApp()})}
boot();
</script>
</body></html>
